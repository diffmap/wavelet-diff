name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas matplotlib scipy scikit-learn statsmodels tqdm PyWavelets ruff pytest
          pip install -e .

      - name: Lint
        run: ruff check src data tests

      - name: Test
        run: pytest -q
